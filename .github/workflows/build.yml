name: build

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      data-api: ${{ steps.filter.outputs.data-api }}
      simulator: ${{ steps.filter.outputs.simulator }}
      builder: ${{ steps.filter.outputs.builder }}

    steps:
      - name: Select images to build
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No diff to compare (manual run, new branch, or a force push the API
          # cannot resolve): build everything.
          if [[ "${{ github.event_name }}" != "push" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            FILES=ALL
          else
            FILES=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename') || FILES=ALL
          fi

          # Members every image links: helix-common, helix-types, helix-tcp-types.
          SHARED='^(Cargo\.(toml|lock)|rust-toolchain\.toml|\.github/workflows/build\.yml|crates/(common|types|tcp-types|vendored)/)'

          match() {
            if [[ "$FILES" == ALL ]] || grep -qE "$SHARED|$1" <<< "$FILES"; then
              echo true
            else
              echo false
            fi
          }

          {
            echo "relay=$(match '^(relay\.Dockerfile|crates/(relay|database|data-api|operator|website)/)')"
            echo "data-api=$(match '^(data-api\.Dockerfile|crates/(data-api|database)/)')"
            echo "simulator=$(match '^(simulator\.Dockerfile|crates/simulator/)')"
            echo "builder=$(match '^(builder\.Dockerfile|crates/builder/)')"
          } >> "$GITHUB_OUTPUT"

  build-relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_NAME
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_NAME="${BRANCH}_${SHORT_SHA}"
          else
            REF_BRANCH=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            IMAGE_NAME="${REF_BRANCH}"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./relay.Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/helix-relay:${{ env.IMAGE_NAME }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-relay:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-relay:buildcache,mode=max

  build-data-api:
    needs: changes
    if: needs.changes.outputs.data-api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_NAME
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_NAME="${BRANCH}_${SHORT_SHA}"
          else
            REF_BRANCH=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            IMAGE_NAME="${REF_BRANCH}"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./data-api.Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/helix-data:${{ env.IMAGE_NAME }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-data:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-data:buildcache,mode=max

  build-simulator:
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_NAME
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_NAME="${BRANCH}_${SHORT_SHA}"
          else
            REF_BRANCH=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            IMAGE_NAME="${REF_BRANCH}"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./simulator.Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/helix-simulator:${{ env.IMAGE_NAME }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-simulator:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-simulator:buildcache,mode=max

  build-builder:
    needs: changes
    if: needs.changes.outputs.builder == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_NAME
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_NAME="${BRANCH}_${SHORT_SHA}"
          else
            REF_BRANCH=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            IMAGE_NAME="${REF_BRANCH}"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./builder.Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/helix-builder:${{ env.IMAGE_NAME }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-builder:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/helix-builder:buildcache,mode=max
