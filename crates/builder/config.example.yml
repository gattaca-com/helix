# helix-builder merging configuration (--merging.config)

# Address the merging TCP server listens on for relay connections.
listen_addr: "0.0.0.0:9876"

# Allowlisted relay api keys (MergerRegistrationV1.api_key, UUID form).
api_keys:
  - "00000000-0000-0000-0000-000000000001"

# Advertised to the relay in MergerAckV1 and enforced on ingest.
max_orders_per_slot: 8192
max_frame_bytes: 33554432 # 32 MiB

supports_zstd: true
socket_buf_size: 67108864 # 64 MiB, matches the relay side

handshake_timeout_ms: 3000
idle_disconnect_s: 30

max_blocks_per_slot: 256
event_queue_capacity: 4096

# Optional core pins; the merge engine is one thread.
cores:
  server_tile: 6
  merge_worker: 7

# One merge per candidate builder, on that builder's newest appendable block,
# extended with the pooled orders whenever the pool grows. We cannot know which
# builder holds the top bid when get_header is called, so every candidate is
# merged independently.
speculation:
  enabled: true
  # Builders merged per slot. One merge runs per builder that sends appendable
  # blocks, so this only has to exceed the relay's collateral set.
  max_streams: 16
  # The relay uses its corresponding max_merged_bid_age_ms as the permitted
  # receive-time lag behind the latest same-builder bid. Here it additionally
  # limits the absolute time spent improving one base.
  max_base_age_ms: 50

# Prometheus endpoint for the merging role; omit to disable.
metrics_port: 9600

# Publish #[timed] frames for the flux-profiler CLI.
enable_flux_profiler: false

emission:
  # Only emit when proposer value improves by more than this many wei.
  min_value_increase_wei: 0
